.appTile:nth-child(3n+2){background:linear-gradient(145deg,#35b89d,#167965)}.appTile:nth-child(3n){background:linear-gradient(145deg,#e2aa4d,#8c5a27)}

function writeGarageSnapshot(){
  try{
    const valid=id=>id==='starter'||shopCars.some(c=>c.id===id);
    const safeOwned=[...new Set(['starter',...ownedCars.filter(valid)])];
    const stamp=Date.now();
    const safeSelected=valid(selectedCar)&&safeOwned.includes(selectedCar)?selectedCar:'starter';
    const snapshot={version:4,savedAt:stamp,ownedCars:safeOwned,selectedCar:safeSelected};
    const raw=JSON.stringify(snapshot);
    // ذخیرهٔ مستقل و دائمی مالکیت خودروها، جدا از ذخیرهٔ کلی بازی
    localStorage.setItem(GARAGE_PERMANENT_KEY,raw);
    localStorage.setItem('shahrAzad_garage',raw);
    localStorage.setItem(GARAGE_SAVE_KEY,raw);
    localStorage.setItem('shahrAzad_garage_backup',raw);
    localStorage.setItem(GARAGE_OWNED_KEY,raw);
    selectedCar=safeSelected;
    return true;
  }catch(e){return false;}
}
function saveGarage(){writeGarageSnapshot();try{if(typeof saveFullGame==='function')saveFullGame()}catch(e){}}
function restoreGaragePersistence(){
  try{
    const candidates=[GARAGE_PERMANENT_KEY,'shahrAzad_garage',GARAGE_SAVE_KEY,'shahrAzad_garage_backup',GARAGE_OWNED_KEY].map(k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}).filter(v=>v&&Array.isArray(v.ownedCars));
    try{const full=JSON.parse(localStorage.getItem('shahrAzad_fullProgress_v1')||'null');if(full&&full.garage&&Array.isArray(full.garage.ownedCars))candidates.push({savedAt:Number(full.savedAt)||0,ownedCars:full.garage.ownedCars,selectedCar:full.garage.selectedCar});}catch(e){}
    if(!candidates.length)return;
    const valid=id=>id==='starter'||shopCars.some(c=>c.id===id);
    const merged=[...new Set(['starter',...candidates.flatMap(v=>v.ownedCars).filter(valid)])];
    ownedCars=merged;
    candidates.sort((a,b)=>(Number(b.savedAt)||0)-(Number(a.savedAt)||0));
    const preferred=candidates.find(v=>typeof v.selectedCar==='string'&&valid(v.selectedCar)&&merged.includes(v.selectedCar));
    if(preferred)selectedCar=preferred.selectedCar;
    writeGarageSnapshot();
  }catch(e){}
}

// سیستم کشاورزی شهر آزاد: چهار قطعه زمین، بذرهای قابل خرید و زمان رشد ذخیره‌شونده
// زمین کشاورزی در سمت جنوبی خیابان
 const FARM={x:825,y:1650,w:290,h:180,kioskX:837,kioskY:1663};
const farmPlotSpots=[
 {x:915,y:1670},{x:963,y:1670},{x:915,y:1720},{x:963,y:1720}
];
let farmPlots=[],farmSeeds={wheat:0,banana:0},pendingSalary=0;
try{
 const fs=JSON.parse(localStorage.getItem('shahrAzad_farm')||localStorage.getItem('shahrAzad_farm_backup')||'{}');
 farmPlots=Array.isArray(fs.plots)?fs.plots.slice(0,4):[];
 while(farmPlots.length<4)farmPlots.push(null);
 farmSeeds={wheat:Math.max(0,Number(fs.seeds?.wheat)||0),banana:Math.max(0,Number(fs.seeds?.banana)||0)};
 pendingSalary=Math.max(0,Number(fs.pendingSalary)||0);
}catch(e){farmPlots=[null,null,null,null];farmSeeds={wheat:0,banana:0};pendingSalary=0}
function saveFarm(){
 try{
  const snapshot={version:2,savedAt:Date.now(),plots:farmPlots,seeds:farmSeeds,pendingSalary:Math.max(0,Math.floor(Number(pendingSalary)||0))};
  const raw=JSON.stringify(snapshot);
  localStorage.setItem('shahrAzad_farm',raw);
  localStorage.setItem('shahrAzad_farm_backup',raw);
  // هم‌زمان ذخیرهٔ جامع را تازه کن تا نسخهٔ قدیمی روی برداشت/پرداخت‌شده بازنویسی نشود.
  if(typeof saveFullGame==='function')saveFullGame();
 }catch(e){}
}
function cropInfo(type){
 return type==='banana'
  ? {name:'موز',emoji:'🍌',duration:5*60*1000,seedPrice:200,wage:40}
  : {name:'گندم',emoji:'🌾',duration:2*60*1000,seedPrice:100,wage:40};
}
function cropReady(plot){return !!plot && Date.now()-Number(plot.plantedAt||0)>=cropInfo(plot.type).duration}
function openFarmShop(){
 if(!activeJob||activeJob.name!=='کشاورز'){toast('برای خرید بذر و کار در زمین، اول از گوشی شغل کشاورز را انتخاب کن');return}
 modal('🏪 دکه بذر کشاورزی','بذر مورد نظرت را بخر. قیمت‌ها از سکه‌های بازی کم می‌شوند.',[
  ['🌾 خرید بذر گندم — ۱۰۰ سکه',()=>{payCoins(100,'خرید بذر گندم',()=>{farmSeeds.wheat++;saveFarm();openFarmShop();toast('یک بذر گندم خریدی')})}],
  ['🍌 خرید بذر موز — ۲۰۰ سکه',()=>{payCoins(200,'خرید بذر موز',()=>{farmSeeds.banana++;saveFarm();openFarmShop();toast('یک بذر موز خریدی')})}],
  ['🎒 موجودی بذرها',()=>modal('🎒 موجودی بذرها','بذر گندم: '+farmSeeds.wheat+' عدد\nبذر موز: '+farmSeeds.banana+' عدد')]
 ]);
}
function openFarm(){
 if(!activeJob||activeJob.name!=='کشاورز'){toast('برای کار در زمین باید شغل کشاورز را داشته باشی');return}
 const opts=farmPlots.map((plot,i)=>{
  if(!plot)return ['🟫 قطعه '+(i+1)+' — خالی؛ کاشت بذر',()=>plantFarmPlot(i)];
  const info=cropInfo(plot.type);
  if(cropReady(plot))return [info.emoji+' قطعه '+(i+1)+' — '+info.name+' آماده برداشت',()=>harvestFarmPlot(i)];
  const left=Math.max(0,info.duration-(Date.now()-Number(plot.plantedAt||0)));
  const mins=Math.floor(left/60000),secs=Math.ceil((left%60000)/1000);
  return [info.emoji+' قطعه '+(i+1)+' — '+info.name+'؛ زمان باقی‌مانده '+mins+':'+String(secs).padStart(2,'0'),()=>toast('محصول هنوز آماده نیست؛ کمی صبر کن')];
 });
 opts.push(['🏪 رفتن به دکه بذر',openFarmShop],['💰 حقوق آماده دریافت: '+pendingSalary+' سکه',claimFarmSalary]);
 modal('🌱 زمین کشاورزی','چهار قطعه زمین داری. گندم ۲ دقیقه و موز ۵ دقیقه برای رشد زمان می‌خواهد.',opts);
}
function plantFarmPlot(index){
 if(farmPlots[index]){toast('این قطعه هنوز محصول دارد');return}
 const opts=[];
 if(farmSeeds.wheat>0)opts.push(['🌾 کاشت گندم — رشد در ۲ دقیقه',()=>{farmSeeds.wheat--;farmPlots[index]={type:'wheat',plantedAt:Date.now()};saveFarm();openFarm();toast('گندم کاشته شد؛ ۲ دقیقه دیگر آماده برداشت است')}]);
 if(farmSeeds.banana>0)opts.push(['🍌 کاشت موز — رشد در ۵ دقیقه',()=>{farmSeeds.banana--;farmPlots[index]={type:'banana',plantedAt:Date.now()};saveFarm();openFarm();toast('موز کاشته شد؛ ۵ دقیقه دیگر آماده برداشت است')}]);
 if(!opts.length)opts.push(['رفتن به دکه برای خرید بذر',openFarmShop]);
 modal('🌱 کاشت در قطعه '+(index+1),'نوع بذر را انتخاب کن.',opts);
}
function harvestFarmPlot(index){
 const plot=farmPlots[index];if(!plot)return;
 if(!cropReady(plot)){toast('محصول هنوز رشد نکرده است');return}
 const info=cropInfo(plot.type);
 farmPlots[index]=null;
 pendingSalary+=info.wage;
 saveFarm();
 hud();
 modal('✅ برداشت انجام شد',info.emoji+' '+info.name+' را برداشت کردی.\nحقوق این برداشت: '+info.wage+' سکه\nحقوق آماده دریافت: '+pendingSalary+' سکه',[
  ['برداشت محصول بعدی',openFarm],
  ['دریافت حقوق فوری',claimFarmSalary]
 ]);
}
function getEarnedSalary(){
 // ذخیرهٔ مستقل و پشتیبان با زمان جدیدتر، مرجع قطعی حقوق برداشت‌شده است.
 try{
  const a=JSON.parse(localStorage.getItem('shahrAzad_farm')||'null');
  const b=JSON.parse(localStorage.getItem('shahrAzad_farm_backup')||'null');
  const saved=[a,b].filter(v=>v&&Number.isFinite(Number(v.pendingSalary))).sort((x,y)=>(Number(y.savedAt)||0)-(Number(x.savedAt)||0))[0];
  if(saved)pendingSalary=Math.max(0,Math.floor(Number(saved.pendingSalary)||0));
 }catch(e){}
 return Math.max(0,Math.floor(Number(pendingSalary)||0));
}
function saveEarnedSalary(value){
 pendingSalary=Math.max(0,Math.floor(Number(value)||0));
 saveFarm();
}
function claimFarmSalary(){
 // ورود به صفحهٔ تأیید؛ تا وقتی بازیکن دکمهٔ نهایی را نزند پولی کم یا زیاد نمی‌شود.
 const amount=getEarnedSalary();
 if(amount<=0){toast('حقوق آمادهٔ دریافت صفر است؛ ابتدا کار کن و حقوق جمع کن');return}
 const fee=Math.ceil(amount*0.05);
 const net=Math.max(0,amount-fee);
 modal('💰 پرداخت فوری حقوق','حقوق کارکرده: '+amount.toLocaleString('fa-IR')+' سکه\nکارمزد ۵٪: '+fee.toLocaleString('fa-IR')+' سکه\nمبلغی که دریافت می‌کنی: '+net.toLocaleString('fa-IR')+' سکه\nبرای واریز، دکمهٔ پرداخت فوری را بزن.',[
  ['✅ پرداخت فوری',()=>confirmFarmSalaryPayment(amount,fee,net)],
  ['بازگشت به بانک',openBank]
 ]);
}
function confirmFarmSalaryPayment(amount,fee,net){
 const current=getEarnedSalary();
 if(current<=0){toast('حقوقی برای پرداخت باقی نمانده است');openBank();return}
 // اگر مبلغ ذخیره در فاصلهٔ باز بودن صفحه تغییر کرد، مبلغ جدید محاسبه می‌شود.
 const payAmount=Math.min(current,Math.max(0,Math.floor(Number(amount)||0)));
 const payFee=Math.ceil(payAmount*0.05);
 const payNet=Math.max(0,payAmount-payFee);
 saveEarnedSalary(current-payAmount);
 coins+=payNet;
 saveFullGame();hud();
 modal('✅ پرداخت انجام شد','حقوق پرداخت‌شده: '+payAmount.toLocaleString('fa-IR')+' سکه\nکارمزد ۵٪: '+payFee.toLocaleString('fa-IR')+' سکه\nواریزی به کیف پول: '+payNet.toLocaleString('fa-IR')+' سکه');
}
function openJobSalary(){

 modal('💼 حقوق کارکرده','حقوقی که تا الان با کارکردن به دست آورده‌ای: '+amount.toLocaleString('fa-IR')+' سکه');
}

// مسیر تاکسی فقط از محور خیابان‌های شبکه‌ای شهر عبور می‌کند.

// مرکز خیابان‌های واقعی شبکه شهر و مسیرهای بزرگراه
const snapRoadXs=[364,757,1150,1543,1936,2202];
const snapRoadYs=[299,627,955,1283,1611,1939];
const snapHighwayYs=[857,1157];
function nearestValue(arr,v){return arr.reduce((a,b)=>Math.abs(b-v)<Math.abs(a-v)?b:a)}
function nearestRoadPoint(x,y){
 if(x>=2200&&y>790&&y<1235)return {x:Math.max(2202,Math.min(6200,x)),y:nearestValue(snapHighwayYs,y)};
 return {x:nearestValue(snapRoadXs,x),y:nearestValue(snapRoadYs,y)};
}
function makeStreetRoute(from,to){
 // تاکسی فقط روی محور خیابان‌ها حرکت می‌کند؛ نقطه‌های انتخابی داخل ساختمان
 // ابتدا به نزدیک‌ترین تقاطع امن خیابان تبدیل می‌شوند.
 const a=nearestRoadPoint(from.x,from.y),b=nearestRoadPoint(to.x,to.y);
 const pts=[{x:a.x,y:a.y}];
 const add=(x,y)=>{const last=pts[pts.length-1];if(Math.hypot(x-last.x,y-last.y)>2)pts.push({x,y})};
 const highwayA=a.x>=2200&&a.y>=790&&a.y<=1235;
 const highwayB=b.x>=2200&&b.y>=790&&b.y<=1235;
 if(highwayA||highwayB){
  const lane=highwayA?a.y:b.y;
  if(!highwayA){add(2202,a.y);add(2202,lane)}
  else add(a.x,lane);
  if(!highwayB){add(2202,lane);add(2202,b.y);add(b.x,b.y)}
  else add(b.x,lane);
 }else{
  // مسیر L شکل: فقط در امتداد مرکز خیابان‌ها، بدون عبور مورب از بلوک‌ها
  add(b.x,a.y);add(b.x,b.y);
 }
 return pts.filter((v,i)=>i===0||Math.hypot(v.x-pts[i-1].x,v.y-pts[i-1].y)>2);
}
function snapTaxiStart(pickup){
 const candidates=[];
 for(const x of snapRoadXs)for(const y of snapRoadYs){
  const d=Math.abs(x-pickup.x)+Math.abs(y-pickup.y);
  if(d>=900)candidates.push({x,y,d});
 }
 candidates.sort((a,b)=>a.d-b.d);
 return candidates[0]?{x:candidates[0].x,y:candidates[0].y}:{x:snapRoadXs[0],y:snapRoadYs[0]};
}
function placeOnSnapRoute(r,progress){
 const pts=r.route;if(!pts||!pts.length)return;
 const lengths=[];let total=0;
 for(let i=1;i<pts.length;i++){const len=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);lengths.push(len);total+=len;}
 if(total<=0){r.x=pts[pts.length-1].x;r.y=pts[pts.length-1].y;r.index=pts.length;return;}
 let remain=total*Math.max(0,Math.min(1,progress));
 for(let i=0;i<lengths.length;i++){
  const a=pts[i],b=pts[i+1],len=lengths[i];
  if(remain<=len||i===lengths.length-1){
   const t=len?Math.min(1,remain/len):1;
   r.x=a.x+(b.x-a.x)*t;r.y=a.y+(b.y-a.y)*t;
   r.dir=Math.atan2(b.y-a.y,b.x-a.x);r.index=i+(t>=1?1:0);return;
  }
  remain-=len;
 }
}

function advanceSnapRoute(){
 if(!snapRide||snapRide.phase==='done'||snapRide.phase==='waiting')return;
 const r=snapRide;
 if(r.phase==='pickup'){
  // پیشروی بر اساس ساعت واقعی؛ با افت فریم هم تاکسی دقیقاً در ثانیهٔ ۴۰ می‌رسد.
  const elapsed=performance.now()-(r.pickupStartedAt||performance.now());
  placeOnSnapRoute(r,elapsed/40000);
  if(elapsed<40000)return;
  r.index=r.route.length;
 }
 if(r.index>=r.route.length){
  if(r.phase==='pickup'){
   r.phase='waiting';r.boardReady=true;r.waitingSince=performance.now();r.speed=0;setSnapBoardButton(true);
   toast('🚕 ماشین به مبدأ رسید و توقف کرد؛ دکمهٔ «سوار شدن به اسنپ» را بزن');
  }else{
   const end=r.dropoff||r.to;p.x=end.x;p.y=end.y;p.car=false;p.inSnapPassenger=false;p.dir=r.dir;
   r.phase='done';setSnapBoardButton(false);
   toast('✅ به مقصد رسیدی! سفر اسنپ تمام شد');
   setTimeout(()=>{if(snapRide&&snapRide.phase==='done')snapRide=null},3500);
  }
  return;
 }
 const target=r.route[r.index],dx=target.x-r.x,dy=target.y-r.y,d=Math.hypot(dx,dy);
 if(d<Math.max(3,r.speed)){r.x=target.x;r.y=target.y;r.index++;}
 else{
  const step=Math.min(r.speed,d),nx=r.x+dx/d*step,ny=r.y+dy/d*step;
  // مانع نهایی: حتی اگر مسیر اشتباه ساخته شود تاکسی اجازه ورود به ساختمان را ندارد.
  if(insideBuilding(nx,ny,18)){
   const altX=insideBuilding(nx,r.y,18)?r.x:nx;
   const altY=insideBuilding(r.x,ny,18)?r.y:ny;
   if(altX===r.x&&altY===r.y){r.index++;return}
   r.x=altX;r.y=altY;
  }else{r.x=nx;r.y=ny;}
 }
 const next=r.route[r.index]||target;r.dir=Math.atan2(next.y-r.y,next.x-r.x);
 if(r.phase==='trip'){p.x=r.x;p.y=r.y;p.car=false;p.inSnapPassenger=true}
}

    localStorage.setItem('shahrAzad_isObserver',isObserver?'1':'0');
    writeGarageSnapshot();
    return true;
  }catch(e){return false;}

function restoreFullGame(){
  try{
    const s=JSON.parse(localStorage.getItem(FULL_SAVE_KEY)||'null');
    if(!s||s.version!==1)return;
    if(s.stats){
      if(Number.isFinite(s.stats.coins))coins=s.stats.coins;
      if(Number.isFinite(s.stats.hunger))hunger=s.stats.hunger;
      if(Number.isFinite(s.stats.hp))hp=s.stats.hp;
      if(Number.isFinite(s.stats.stars))stars=s.stats.stars;
      if(Number.isFinite(s.stats.rep))rep=s.stats.rep;
      if(Number.isFinite(s.stats.level))level=s.stats.level;
    }
    if(s.player&&Number.isFinite(s.player.x)&&Number.isFinite(s.player.y)){
      p.x=Math.max(20,Math.min(CW-20,s.player.x));p.y=Math.max(20,Math.min(CH-20,s.player.y));
      if(Number.isFinite(s.player.dir))p.dir=s.player.dir;
      p.car=!!s.player.car;p.carColor=typeof s.player.carColor==='string'?s.player.carColor:'#159a99';
      if(typeof s.player.vehicleId==='string')p.vehicleId=s.player.vehicleId;
      p.run=false;
    }
    if(s.camera){if(Number.isFinite(s.camera.x))cam.x=s.camera.x;if(Number.isFinite(s.camera.y))cam.y=s.camera.y;}
    // باز بودن شغل کشاورزی هم مستقل و هم داخل ذخیرهٔ جامع نگهداری می‌شود.
    // وجود شغل کشاورز در ذخیرهٔ قبلی نیز به معنی پرداخت هزینه و باز شدن آن است.
    if(s.farmJobUnlocked===true||(s.job&&s.job.name==='کشاورز')){
      farmJobUnlocked=true;
      try{localStorage.setItem('shahrAzad_farmJobUnlocked','1')}catch(e){}
    }
    // ذخیرهٔ مستقل شغل مرجع اصلی است؛ تا اطلاعات قدیمی داخل ذخیرهٔ جامع
    // نتواند شغل تازه‌ای را که بازیکن انتخاب کرده، هنگام ورود عوض کند.
    let savedJob=null;
    try{
      const jd=JSON.parse(localStorage.getItem('shahrAzad_activeJobData')||'null');
      if(jd&&typeof jd.name==='string')savedJob=jd;
      else {const legacy=localStorage.getItem('shahrAzad_activeJob');if(legacy)savedJob={name:legacy};}
    }catch(e){}
    if(!savedJob&&s.job&&typeof s.job.name==='string')savedJob=s.job;
    if(savedJob){
      const found=jobs.find(j=>j.name===savedJob.name);
      if(found&&(found.name!=='کشاورز'||farmJobUnlocked)){activeJob=found;if(Number.isFinite(savedJob.pay))activeJob.pay=savedJob.pay;try{localStorage.setItem('shahrAzad_activeJob',activeJob.name);localStorage.setItem('shahrAzad_activeJobData',JSON.stringify({name:activeJob.name,pay:activeJob.pay,savedAt:Date.now()}));if(activeJob.name==='کشاورز')localStorage.setItem('shahrAzad_farmJobUnlocked','1');}catch(e){}}
      else if(found&&found.name==='کشاورز'&&!farmJobUnlocked){activeJob=null;try{localStorage.removeItem('shahrAzad_activeJob');localStorage.removeItem('shahrAzad_activeJobData')}catch(e){}}
    }
    if(s.roles&&typeof s.roles==='object'){
      isPresident=!!s.roles.president;
      isObserver=!isPresident&&!!s.roles.observer;
      if(isPresident||isObserver)activeJob=null;
      try{
        if(isPresident){localStorage.setItem('shahrAzad_isPresident','1');localStorage.removeItem('shahrAzad_isObserver');localStorage.removeItem('shahrAzad_activeJob');}
        else if(isObserver){localStorage.setItem('shahrAzad_isObserver','1');localStorage.removeItem('shahrAzad_isPresident');localStorage.removeItem('shahrAzad_activeJob');}
        else{localStorage.removeItem('shahrAzad_isPresident');localStorage.removeItem('shahrAzad_isObserver');}
      }catch(e){}
    }
    if(Number.isFinite(s.fuelLiters))fuelLiters=Math.max(0,Math.min(60,s.fuelLiters));
    if(s.garage&&Array.isArray(s.garage.ownedCars)){
      const validGarageId=id=>id==='starter'||shopCars.some(c=>c.id===id);
      ownedCars=[...new Set(['starter',...ownedCars.filter(validGarageId),...s.garage.ownedCars.filter(validGarageId)])];
    }
    if(s.garage&&typeof s.garage.selectedCar==='string'&&(s.garage.selectedCar==='starter'||ownedCars.includes(s.garage.selectedCar)))selectedCar=s.garage.selectedCar;
    if(!ownedCars.includes(selectedCar))selectedCar='starter';
    if(s.backpack&&s.backpack.items&&typeof s.backpack.items==='object')backpack=s.backpack.items;
    if(s.backpack&&Number.isFinite(s.backpack.capacity))backpackCapacity=Math.max(3,Math.min(10,s.backpack.capacity));
    if(s.skin){if(Array.isArray(s.skin.ownedSkins))ownedSkins=s.skin.ownedSkins.filter(id=>typeof id==='string'&&skinCatalog.some(sk=>sk.id===id));if(typeof s.skin.selectedSkin==='string'&&(s.skin.selectedSkin==='default'||ownedSkins.includes(s.skin.selectedSkin)))selectedSkin=s.skin.selectedSkin;}
    if(s.farm){if(Array.isArray(s.farm.plots))farmPlots=s.farm.plots.slice(0,4);while(farmPlots.length<4)farmPlots.push(null);if(s.farm.seeds)farmSeeds={wheat:Math.max(0,Number(s.farm.seeds.wheat)||0),banana:Math.max(0,Number(s.farm.seeds.banana)||0)};if(Number.isFinite(s.farm.pendingSalary))pendingSalary=Math.max(0,s.farm.pendingSalary);saveFarm();}
    if(s.employeeSalary){if(Number.isFinite(s.employeeSalary.due))employeeSalaryDue=Math.max(0,s.employeeSalary.due);if(Number.isFinite(s.employeeSalary.amount))employeeSalaryAmount=Math.max(0,s.employeeSalary.amount);saveEmployeeSalary();}
    // رمز و موجودی کارت زاپ از ذخیرهٔ اختصاصی خوانده می‌شود تا ذخیرهٔ قدیمیِ کلی بازی آن را بازنویسی نکند.
    try{
      const dedicatedZap=JSON.parse(localStorage.getItem('shahrAzad_zapCard')||'null');
      if(dedicatedZap&&typeof dedicatedZap==='object'&&/^\\d{4,8}$/.test(String(dedicatedZap.pin||''))){
        zapCard=dedicatedZap;
      }else if(s.zapCard&&typeof s.zapCard==='object'&&/^\\d{4,8}$/.test(String(s.zapCard.pin||''))){
        zapCard=s.zapCard;
        saveZapCard();
      }
    }catch(e){/* نگه‌داشتن کارت معتبر فعلی در صورت خرابی ذخیره */}
    if(typeof s.sound==='boolean')sound=s.sound;if(typeof s.night==='boolean')night=s.night;
    if(Array.isArray(s.collectedCoins))coinsMap.forEach((c,i)=>{c.got=!!s.collectedCoins[i]});
    let restoredParked=Array.isArray(s.parkedCars)?s.parkedCars:[];
    try{const extra=JSON.parse(localStorage.getItem(PARKED_CARS_KEY)||'null');if(extra&&Array.isArray(extra.cars)&&Number(extra.savedAt||0)>=Number(s.savedAt||0))restoredParked=extra.cars;}catch(e){}
    if(restoredParked.length||Array.isArray(s.parkedCars)){cars.splice(0,cars.length,...restoredParked.filter(c=>c&&Number.isFinite(c.x)&&Number.isFinite(c.y)).map(c=>({...c,playerParked:true,parked:true})));}
  }catch(e){/* فایل ذخیره خراب بود؛ بازی با ذخیره‌های سالم قبلی بالا می‌آید */}
}
restoreFullGame();
// ذخیرهٔ اختصاصی مزرعه مرجع نهایی است؛ مانع زنده‌شدن دوبارهٔ محصول برداشت‌شده یا حقوق پرداخت‌شده می‌شود.
try{
 const farmCandidates=['shahrAzad_farm','shahrAzad_farm_backup'].map(k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}).filter(v=>v&&typeof v==='object');
 farmCandidates.sort((a,b)=>(Number(b.savedAt)||0)-(Number(a.savedAt)||0));
 if(farmCandidates.length){const f=farmCandidates[0];farmPlots=Array.isArray(f.plots)?f.plots.slice(0,4):[null,null,null,null];while(farmPlots.length<4)farmPlots.push(null);if(f.seeds)farmSeeds={wheat:Math.max(0,Number(f.seeds.wheat)||0),banana:Math.max(0,Number(f.seeds.banana)||0)};pendingSalary=Math.max(0,Math.floor(Number(f.pendingSalary)||0));}
}catch(e){}
// گاراژ مستقل و نسخهٔ پشتیبان، خرید خودروها را حتی در صورت قدیمی بودن ذخیرهٔ اصلی حفظ می‌کند.
restoreGaragePersistence();
// محل شروع ثابت: هر بار ورود به بازی، بازیکن در مرکز شهر ظاهر می‌شود؛
// موقعیت ذخیره‌شدهٔ قبلی فقط برای پیشرفت‌هاست و محل شروع را تغییر نمی‌دهد.
p.x=1100;
p.y=970;
p.dir=0;
p.car=false;
p.run=false;
p.inSnapPassenger=false;
carSpeedKmh=0;
drive={left:false,right:false,gas:false,brake:false};
function syncSavedUi(){
  try{
    hud();syncCarButton();syncSpeedometer();syncFuel();updateBagCount();
    document.getElementById('sound').textContent=sound?'🔊 صدا':'🔇 بی‌صدا';
    if(p.car){driveControls.style.display='flex';joy.style.display='none';steerJoy.style.display='flex';document.getElementById('speedometer').style.display='block';document.getElementById('fuelDisplay').style.display='block';}
    else{driveControls.style.display='none';steerJoy.style.display='none';joy.style.display='grid';document.getElementById('speedometer').style.display='none';document.getElementById('fuelDisplay').style.display='none';}
  }catch(e){}
}
// ذخیرهٔ خودکار چندلایه؛ تغییرات مهم همان لحظه و بقیهٔ وضعیت مرتب ذخیره می‌شوند.
syncSavedUi();saveFullGame();
setInterval(saveFullGame,500);
addEventListener('pagehide',saveFullGame);
addEventListener('beforeunload',saveFullGame);
addEventListener('blur',saveFullGame);
addEventListener('freeze',saveFullGame);
addEventListener('pageshow',()=>{try{restoreGaragePersistence()}catch(e){}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveFullGame();});
// پس از هر به‌روزرسانی HUD نیز همهٔ پیشرفت‌ها ثبت می‌شوند.
const originalHudForSave=hud;
hud=function(){originalHudForSave();saveFullGame();};
loop();update();
})();
</script>
